  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

lass=\"ibpre\">I didn’t write an apology — I built you something. Free.<\u002Fdiv>\n        <\u002Fdiv>\n        <iframe class=\"frame\" loading=\"lazy\" srcdoc=\"&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;en&quot;&gt;\n&lt;head&gt;\n&lt;meta charset=&quot;utf-8&quot;&gt;\n&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;\n&lt;meta name=&quot;x-apple-disable-message-reformatting&quot;&gt;\n&lt;title&gt;Email 1 — I owe you an apology&lt;/title&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;&gt;\n&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin&gt;\n&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Cormorant+Garamond:ital,wght@1,500;1,600&amp;family=Inter:wght@400;500;600;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;\n&lt;style&gt;\n  body { margin:0; padding:0; background:#050505; -webkit-text-size-adjust:100%; }\n  a { text-decoration:none; }\n  .tok { color:#f0d894; border-bottom:1px dashed #6b5a2e; }\n  @media (max-width:620px){\n    .card { width:100% !important; }\n    .pad { padding-left:26px !important; padding-right:26px !important; }\n    .h1 { font-size:29px !important; line-height:1.12 !important; }\n  }\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;\n&lt;div style=&quot;display:none;max-height:0;overflow:hidden;opacity:0;color:#050505;font-size:1px;line-height:1px;&quot;&gt;I went quiet on you — and that's on me. So I didn't write an apology. I built you something. Free.&lt;/div&gt;\n&lt;table role=&quot;presentation&quot; width=&quot;100%&quot; cellpadding=&quot;0&quot; cellspacing=&quot;0&quot; style=&quot;background:#050505;&quot;&gt;\n  &lt;tr&gt;\n    &lt;td align=&quot;center&quot; style=&quot;padding:34px 16px 60px;&quot;&gt;\n      &lt;table role=&quot;presentation&quot; class=&quot;card&quot; width=&quot;600&quot; cellpadding=&quot;0&quot; cellspacing=&quot;0&quot; style=&quot;width:600px;max-width:600px;background:#0d0c0a;border:1px solid #221e15;&quot;&gt;\n        &lt;tr&gt;&lt;td style=&quot;height:3px;background:#c9a86a;line-height:3px;font-size:3px;&quot;&gt;&amp;nbsp;&lt;/td&gt;&lt;/tr&gt;\n\n        &lt;tr&gt;\n          &lt;td class=&quot;pad&quot; align=&quot;center&quot; style=&quot;padding:30px 56px 6px;&quot;&gt;\n            &lt;div style=&quot;font-family:'Cinzel',Georgia,serif;font-size:15px;letter-spacing:6px;color:#c9a86a;text-transform:uppercase;&quot;&gt;Elena&amp;nbsp;Cardone&lt;/div&gt;\n            &lt;div style=&quot;font-family:'Inter',Arial,sans-serif;font-size:9px;letter-spacing:3px;color:#6f6a60;text-transform:uppercase;padding-top:8px;&quot;&gt;Build an Empire · Real Estate&lt;/div&gt;\n          &lt;/td&gt;\n        &lt;/tr&gt;\n\n        &lt;tr&gt;\n          &lt;td class=&quot;pad&quot; style=&quot;padding:36px 56px 0;&quot;&gt;\n            &lt;div style=&quot;font-family:'Inter',Arial,sans-serif;font-size:11px;letter-spacing:3px;color:#8a6d3b;text-transform:uppercase;font-weight:600;&quot;&gt;A personal note&lt;/div&gt;\n          &lt;/td&gt;\n        &lt;/tr&gt;\n\n        &lt;tr&gt;\n          &lt;td class=&quot;pad&quot; style=&quot;padding:14px 56px 0;&quot;&gt;\n            &lt;h1 class=&quot;h1&quot; style=&quot;margin:0;font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:36px;line-height:1.12;color:#f2ede0;text-transform:uppercase;letter-spacing:0.01em;&quot;&gt;I owe you an apology.&lt;/h1&gt;\n          &lt;/td&gt;\n        &lt;/tr&gt;\n\n        &lt;tr&gt;\n          &lt;td class=&quot;pad&quot; style=&quot;padding:24px 56px 0;font-family:'Inter',Arial,sans-serif;font-size:16px;line-height:1.75;color:#c2bcae;&quot;&gt;\n            &lt;p style=&quot;margin:0 0 18px;&quot;&gt;I've been quiet. Too quiet.&lt;/p&gt;\n            &lt;p style=&quot;margin:0 0 18px;&quot;&gt;Months have gone by and you haven't heard a word from me — and there's no version of that I'm proud of. You raised your hand. You told me you wanted to build something real in this business. And then I went silent on you.&lt;/p&gt;\n            &lt;p style=&quot;margin:0 0 18px;&quot;&gt;So before anything else: &lt;strong style=&quot;color:#f2ede0;&quot;&gt;I'm sorry.&lt;/strong&gt;&lt;/p&gt;\n            &lt;p style=&quot;margin:0 0 18px;&quot;&gt;The truth? I got buried building — protecting the empire, the family, the next thing. All the reasons that sound legitimate right up until you realize you left the people who started with you standing in an empty room. That's not who I tell you to be. So I'm not going to pretend it didn't happen. I'm going to make it right.&lt;/p&gt;\n            &lt;p style=&quot;margin:0 0 18px;&quot;&gt;Here's what I know about you, because it's true of me too: you didn't get on this list to collect emails. You got on it because some part of you refuses to run an average real estate career. That part is still in there. It doesn't go quiet just because the market did.&lt;/p&gt;\n            &lt;p style=&quot;margin:0 0 22px;&quot;&gt;So I didn't write you a &quot;we miss you&quot; email. &lt;strong style=&quot;color:#f2ede0;&quot;&gt;I built you something — and I'm giving it to you free.&lt;/strong&gt;&lt;/p&gt;\n          &lt;/td&gt;\n        &lt;/tr&gt;\n\n        &lt;!-- gift callout --&gt;\n        &lt;tr&gt;\n          &lt;td class=&quot;pad&quot; style=&quot;padding:8px 56px 0;&quot;&gt;\n            &lt;table role=&quot;presentation&quot; width=&quot;100%&quot; cellpadding=&quot;0&quot; cellspacing=&quot;0&quot; style=&quot;background:#16140f;border:1px solid #221e15;&quot;&gt;\n              &lt;tr&gt;&lt;td style=&quot;height:2px;background:#c9a86a;line-height:2px;font-size:2px;&quot;&gt;&amp;nbsp;&lt;/td&gt;&lt;/tr&gt;\n              &lt;tr&gt;\n                &lt;td style=&quot;padding:26px 30px 24px;&quot;&gt;\n                  &lt;div style=&quot;font-family:'Inter',Arial,sans-serif;font-size:10px;letter-spacing:3px;color:#c9a86a; quot;color:#f2ede0;&quot;&gt;what would you do with $200 million, free and clear?&lt;/strong&gt;&lt;/p&gt;\n            &lt;p style=&quot;margin:0 0 18px;&quot;&gt;Not to fantasize. To stretch the one muscle that quietly decides everything — the muscle that sets what you believe is possible. Because you cannot list a $5M property if your nervous system flinches at $1M. The ceiling in your head becomes the ceiling on your income.&lt;/p&gt;\n          &lt;/td&gt;\n        &lt;/tr&gt;\n\n        &lt;!-- tiers --&gt;\n        &lt;tr&gt;\n          &lt;td class=&quot;pad&quot; style=&quot;padding:6px 56px 0;&quot;&gt;\n            &lt;table role=&quot;presentation&quot; class=&quot;tiers&quot; width=&quot;100%&quot; cellpadding=&quot;0&quot; cellspacing=&quot;0&quot; style=&quot;border-collapse:separate;border-spacing:8px 0;&quot;&gt;\n              &lt;tr&gt;\n                &lt;td align=&quot;center&quot; width=&quot;25%&quot; style=&quot;background:#16140f;border:1px solid #221e15;padding:18px 6px;&quot;&gt;\n                  &lt;div style=&quot;font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:21px;color:#f0d894;&quot;&gt;$100K&lt;/div&gt;\n                  &lt;div style=&quot;font-family:'Inter',Arial,sans-serif;font-size:8px;letter-spacing:2px;color:#8a8478;text-transform:uppercase;padding-top:5px;&quot;&gt;Extra GCI&lt;/div&gt;\n                &lt;/td&gt;\n                &lt;td align=&quot;center&quot; width=&quot;25%&quot; style=&quot;background:#16140f;border:1px solid #221e15;padding:18px 6px;&quot;&gt;\n                  &lt;div style=&quot;font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:21px;color:#f0d894;&quot;&gt;$500K&lt;/div&gt;\n                  &lt;div style=&quot;font-family:'Inter',Arial,sans-serif;font-size:8px;letter-spacing:2px;color:#8a8478;text-transform:uppercase;padding-top:5px;&quot;&gt;Extra GCI&lt;/div&gt;\n                &lt;/td&gt;\n                &lt;td align=&quot;center&quot; width=&quot;25%&quot; style=&
